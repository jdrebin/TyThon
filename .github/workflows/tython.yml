name: tython

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            tsc/go.sum
            tools/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Go tests (tython)
        run: go test -p 1 ./cmd/tsc ./internal/python ./internal/checker ./internal/lsp -count=1 -timeout=120s
        working-directory: tsc
      - run: npm run licenses:check
      - run: npm test -w tython
