name: tython

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            tsc/go.sum
            tools/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Go tests (tython)
        run: go test -p 1 ./cmd/tsc ./internal/python ./internal/pyprogram ./internal/checker ./internal/lsp -count=1 -timeout=120s
        working-directory: tsc
      - run: npm run licenses:check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI playground generation and execution
        run: |
          go build -o "$RUNNER_TEMP/tython-demo-compiler" ./tsc/cmd/tsc
          TYTHON_TEST_COMPILER="$RUNNER_TEMP/tython-demo-compiler" python3 packages/tython-python/test_demo.py
      - run: npm run test:conformance:prepare
      - run: npm test -w tython
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            tsc/go.sum
            tools/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:conformance:prepare
      - run: npm run test:plan
